<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>群岛回波：图标设计48问</title>
<h1>群岛回波：舰船与建筑图标设计48问</h1>
<p>单选、多选、简答共48题。填写后点击复制，把回答粘贴给我。页面刷新后不会保留答案。</p>
<p>基线：每类建筑／战舰的每个小、中、大尺寸至少10种真正不同形态；保留独立符号和自定义部件拼装方向。</p>
<form id="questions"></form>
<button id="copy" type="button">生成并复制全部回答</button>
<p id="status"></p>
<textarea id="output" rows="16" cols="80" readonly hidden aria-label="可复制的回答"></textarea>
<script>

  ['single','你希望图标的主要表现风格是什么？','仍遵循已有 CRT 美学；请选择轮廓本身的表达。',['带内部细节的工程线稿','厚实轮廓，加少量结构线','细致的单色剪影','像素点阵图标','线稿与剪影按场景混合']],
  ['single','第一批图标采用哪种时代与造型语汇？','这会影响舰艏、桅杆、武器和建筑设备的形状。',['沿用当前虚构舰机与冷战 CRT 方向','以二战舰艇和设施为参考','以现代海军和设施为参考','跨时代分系列，但保持统一画法','完全架空，由功能决定造型']],
  ['multi','需要哪些观察视角？','可分别用于雷达、详情和制造页面。',['俯视','侧视','等距斜视','舰艏／建筑正面','舰艉／建筑背面','局部剖面或结构示意']],
  ['multi','图标要在哪些界面出现？','选出的界面决定资产尺寸与交互版本。',['主雷达／航海地图','座舱导航图','目标详情','港口／机场页面','单位图鉴／命令档案','未来制造与拼装页面','主菜单演示']],
  ['text','有哪些希望参考或避开的视觉作品？','可以写游戏、图片、船型、网址或你不喜欢的表现；之后也可直接附图。','例如：希望像舰船识别手册；不要卡通表情、不要通用菱形代替所有单位。']
 ]},
 {title:'舰船特征', intro:'确定第一批舰种与能够区分它们的结构细节。', questions:[
  ['multi','第一批重点完善哪些舰种？','已有六类占位定义；勾选优先级，不等于立刻加入它们全部战斗能力。',['护航航舰','航空母舰','驱逐舰','巡洋舰','战列舰','潜艇','补给／运输舰','巡逻艇／鱼雷艇']],

  ['single','舰船内部细节应细到哪个层级？','小雷达符号与详情图可以有不同细节密度。',['只保留舰艏、舰桥和主武器','明确舰桥、炮塔、桅杆、烟囱和甲板','细到天线、救生艇和甲板设备','雷达简化，详情展示完整结构']],
  ['multi','哪些结构必须成为舰种识别特征？','优先选择即使单色显示也能辨认的特征。',['舰艏与舰艉形状','长宽比与船体外轮廓','舰桥／上层建筑位置','炮塔数量与布局','飞行甲板／弹射或回收区','桅杆／雷达／天线','烟囱','鱼雷发射器','潜艇围壳与舵面']],
  ['text','有哪些必须表现出来的船型细节或具体例子？','写出某个舰种、舰级或自定义舰设计中，你最不想被省略的特征。','例如：战列舰的三座主炮塔要清楚；航母应能看到甲板和舰岛。']

  ['text','请给出建筑外观的具体偏好或禁忌。','可以分别写港口、指挥部、军营、工厂等类别的区别。','例如：雷达站要能看到雷达盘；工厂不能和城市楼群混淆。']
 ]},
 {title:'情报与身份', intro:'图标显示多少信息，要与目标识别和阵营判断一致。', questions:[
  ['single','雷达中的未知接触允许显示多少轮廓信息？','当前基线是通用回波；若改变，需要同步识别规则。',['保持通用回波，不泄露舰种','只显示舰船／建筑大类','显示不完整或模糊轮廓','只要被发现就显示完整类别图标']],
  ['single','识别信息逐步增加时，图标怎样变化？','这讨论视觉阶段，不预设新增多少识别玩法。',['未知回波 → 类别图标 → 型号细节','类别轮廓不变，逐步增加内部细节','保持符号不变，只增加文字情报','只区分未知／已识别两个状态']],
  ['single','已识别目标的舰级或型号信息放在哪里？','让小尺寸图标不会因文字过多失去轮廓。',['只放详情面板','选择目标时显示短标签','始终显示短标签','用专属轮廓区分，详情补充型号']],
  ['multi','阵营身份用哪些方式区分？','可组合；建议保留不依赖颜色的方式。',['颜色','轮廓线／边框样式','字母或阵营徽记','不同角标形状','编号前缀','线纹／虚实线','友军固定辅助标记']],
  ['multi','同类型多个单位如何互相区分？','类别图标相同，也需要明确实例身份。',['唯一编号','单位名称','短呼号','专属轮廓变体','选中时显示完整身份','所属编队／设施编号']],
  ['text','遇到误识别、失联或可疑目标时，你希望看到什么？','可写希望隐藏、保留或强调的信息；相关机制未实现的部分先作为接口。','例如：失联保留最后轮廓但加虚线；误识别不要突然揭示真实型号。']
 ]},
 {title:'尺寸与形态', intro:'保留每类、每尺寸至少十种不同形态，确定它们如何在屏幕上工作。', questions:[
  ['single','雷达／地图图标的典型屏幕尺寸是多少？','以图标主体像素计，不含选中框和文字。',['约 24 px，优先紧凑','约 32 px，适度结构细节','约 48 px，强调可辨细节','按量程与缩放自适应，设最小可辨尺寸']],
  ['single','详情中的单位图应提供多大展示面积？','这决定完整结构图的制作密度。',['约 128 × 128 px','约 256 × 256 px','约 384 × 384 px','按面板伸缩，并支持放大查看']],
  ['single','缩小与放大时，细节如何变化？','避免只把一张复杂图缩成看不清的细线。',['同一图等比缩放','小尺寸简化轮廓，放大增加结构','雷达符号与详情图完全独立','共享结构，多级简化自动切换']],
  ['multi','十种形态主要通过哪些差异建立？','换色、编号、等比缩放不计作不同形态。',['主体外轮廓','上层建筑／设施位置','炮塔／甲板／设备布局','港口／跑道／道路布局','附属结构组合','不同船体／建筑比例','特定型号的功能结构']],
  ['multi','小、中、大尺寸怎样在视觉上体现？','这是单位实体的尺寸等级，与屏幕像素大小不同。',['整体真实比例','舰体长宽比或建筑占地','结构数量与规模','旁边显示 S / M / L 或文字','独立尺寸角标','详情显示尺寸数据']],
  ['text','在保留十形态要求的前提下，你希望先完成哪些类别／尺寸？','明确第一轮资产优先顺序；其他组合仍保留在开发范围内。','例如：先把驱逐舰与雷达站的三种尺寸做全，再扩展其余类别。']
 ]},
 {title:'状态与 CRT', intro:'确定航向、损伤和操作反馈怎样进入图标，而不淹没结构细节。', questions:[
  ['single','舰船航向如何表现？','建筑可保持固定朝向，舰船需要避免标签跟着旋转。',['船体图标随航向旋转，标签保持水平','主体固定，使用方向箭头','雷达旋转，详情固定标准视角','只在选中时显示航向']],
  ['single','图标需要怎样的动态效果？','默认不把动画当作功能识别的必要条件。',['静态结构图','仅选中／告警时轻微变化','有低频设备运动或扫掠','按界面分别配置静态与动态版本']],
  ['single','CRT 余辉衰减对图标细节如何作用？','当前发现后由亮到暗的规则继续保留。',['轮廓与细节一起衰减','主体回波衰减，识别标记保持可读','只让光晕衰减，结构线保持稳定','雷达真实衰减，详情图稳定显示']],
  ['multi','哪些状态要预留独立视觉标记？','尚未实现的状态先预留资产接口，不代表本轮全部加入玩法。',['受损','起火','沉没／被摧毁','失联／观测过期','停用／无电','施工／维修','友军正在执行命令','武器／甲板不可用']],
  ['multi','选择、悬停与锁定目标用哪些反馈？','尽量让轮廓本身仍可读。',['外圈／选中框','轻微亮度提升','信息标签','指向或航线连线','独立瞄准符号','局部结构高亮']],
  ['text','细节与告警同时出现时，哪些信息必须最先看清？','可以按优先级列出，不必写美术术语。','例如：先看敌我和是否失联，再看舰种；损伤标记不能遮住舰桥。']
 ]},
 {title:'资产与自定义', intro:'确认图标资产和未来拼装舰的关系；技术选项附有实际影响。', questions:[
  ['single','图标资产优先采用哪种形式？','SVG／矢量适合线稿和放大；PNG 适合固定像素细节。',['SVG 矢量线稿','Godot 绘制的矢量结构','透明 PNG 位图','基础矢量与细节位图混合','由你按最终风格选择']],
  ['single','未来自定义战舰的图标怎样生成？','这里只确认接口方向，完整拼装系统仍按 PLAN 的后续阶段实现。',['由拼装部件自动形成轮廓','选择预制基础轮廓，再附装备细节','自动生成后允许手工调整','允许导入自己的图标']],
  ['single','资产命名与检索主要按什么组织？','影响图集浏览与维护，不需要你填写代码路径。',['类别 → 尺寸 → 形态编号','舰级／建筑型号 → 具体变体','同时保留类别编号与可读名称','由你设计，但浏览时能看懂名称']],
  ['multi','拼装接口必须支持哪些连接信息？','与已有端口、连接和保存要求配合。',['舰体首尾拼接','甲板／上层建筑安装位','武器与设备槽位','电力／动力连接','连接方向与局部坐标','兼容类型与端口尺寸','自定义连接点']],
  ['multi','图标和设计应预留哪些导入／导出能力？','本轮可先建立结构，尚未实现的工具按回答排期。',['透明图标导出','完整图集导出','可编辑矢量源文件','拼装结构数据保存／加载','自定义符号替换','缩略图与识别图自动生成']],
  ['text','自定义战舰或建筑有什么外观规则不能违反？','例如部件必须对齐、不能悬空、现实船体限制，或你希望允许的架空程度。','例如：炮塔不能穿透舰桥；舰艏、甲板和舰艉应保持连贯轮廓。']
 ]},
 {title:'交付与验收', intro:'确定第一轮制作顺序、验收方式和还没有覆盖的限制。', questions:[
  ['single','这次 SuperLarge 更新的制作顺序如何安排？','先确认风格的方案能减少批量资产返工。',['先做两艘船与两座建筑样板，再扩展','先把现有六舰种／七建筑类别做成完整类别图标','先做指定优先类别的三尺寸十形态','先建立全部形态库与图集，再接入游戏']],
  ['single','现有简单占位符号怎样处理？','保留未知回波与替换已识别图标可以分别进行。',['替换已识别单位图标，保留未知回波','全部替换为新视觉体系','新旧并存，设置中可切换','占位符号仅保留为资源缺失时的后备']],
  ['single','你希望怎样审查和浏览新资产？','需要让每种形态的差异都能直接比较。',['分类图集／对照页','游戏内单位图鉴','Godot 中的资源展示场景','图集、图鉴与展示场景一起提供']],
  ['multi','哪些标准必须进入图标验收？','可选择多个；既有十形态和唯一 ID 检查继续保留。',['不看名称也能区分舰种／建筑用途','小尺寸时轮廓清楚','放大后有真实结构细节','各形态有明显结构差异','单色或灰度仍能辨认','未知目标不泄露隐藏情报','航向旋转后仍易辨认','在实际 CRT 中保持可读']],
  ['multi','需要提供哪些可读性选项？','这些选项可用于设置、资产版本或显示密度。',['更粗的轮廓线','高对比版本','降低光晕与余辉干扰','扩大图标／文字','简化内部细节','不依赖颜色的阵营标记','关闭图标动画']],
  ['text','还有哪些必须遵守的要求，或你想明确交给我决定的部分？','可以补充上面未覆盖的限制；写“其余按美学文档由你决定”也是明确回答。','例如：只先做俯视图；具体像素尺寸由你决定；不要用数字冒充十种形态。']
 ]}
];
const records = [];
let number = 0;
for (const group of GROUPS) {
 const heading = document.createElement('h2');
 heading.textContent = group.title;
 document.getElementById('questions').append(heading);
 for (const [type, title, hint, options] of group.questions) {
  const id = 'Q' + String(++number).padStart(2, '0');
  const field = document.createElement('fieldset');
  const legend = document.createElement('legend');
  legend.textContent = id + ' [' + {single:'单选',multi:'多选',text:'简答'}[type] + '] ' + title;
  field.append(legend);
  const description = document.createElement('p');
  description.textContent = hint;
  field.append(description);
  if (type === 'text') {
   const input = document.createElement('textarea');
   input.name = id; input.rows = 3; input.cols = 70;
   input.placeholder = options; input.setAttribute('aria-label', title);
   field.append(input);
  } else {
   for (const option of [...options, '暂不确定']) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = type === 'single' ? 'radio' : 'checkbox';
    input.name = id; input.value = option;
    label.append(input, document.createTextNode(option));
    field.append(label, document.createElement('br'));
   }
  }
  records.push({id, title, type, field, group:group.title});
  document.getElementById('questions').append(field);
 }
}
document.getElementById('questions').onsubmit = event => event.preventDefault();
document.getElementById('copy').onclick = async () => {
 const lines = ['群岛回波 / Echoes of the Archipelago — 图标设计48问回答', ''];
 for (const q of records) {
  const answer = q.type === 'text'
   ? q.field.querySelector('textarea').value.trim()
   : [...q.field.querySelectorAll('input:checked')].map(input => input.value).join('；');
  lines.push(q.id + ' [' + q.group + '] ' + q.title, '回答：' + (answer || '未填写'), '');
 }
 const output = document.getElementById('output');
 output.hidden = false; output.value = lines.join('\n'); output.focus(); output.select();
 let copied = false;
 try { await navigator.clipboard.writeText(output.value); copied = true; }
 catch { try { copied = document.execCommand('copy'); } catch {} }
 document.getElementById('status').textContent = copied
  ? '已复制，请粘贴给我。' : '回答已生成并选中，请按 Ctrl+C 手动复制。';
};
</script>
</html>
